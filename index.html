<header><div class="brand">✦ 우주 별빛 구조대</div><div class="tag">오늘의 작은 도전, 반짝이는 나</div><div class="header-controls"><label class="volume-control" for="sound-volume">음량 <input id="sound-volume" type="range" min="20" max="100" value="75" step="5" oninput="setSoundVolume(this.value)" onchange="playSound('next')" aria-label="효과음 크기"><output id="volume-value">75%</output></label><button class="small" id="sound-toggle" onclick="toggleSound()" aria-pressed="true" aria-label="효과음 켜짐, 누르면 소리 끄기">🔊 소리 끄기</button><button class="small" onclick="goHome()">우주 지도</button></div></header><main id="app"></main>
<script>
'use strict';
const ROWS=[['ㅂ','ㅈ','ㄷ','ㄱ','ㅅ','ㅛ','ㅕ','ㅑ','ㅐ','ㅔ'],['ㅁ','ㄴ','ㅇ','ㄹ','ㅎ','ㅗ','ㅓ','ㅏ','ㅣ'],['ㅋ','ㅌ','ㅊ','ㅍ','ㅠ','ㅜ','ㅡ']], CODES=['QWERTYUIOP','ASDFGHJKL','ZXCVBNM'], BASE=ROWS.flat(), MAP=Object.fromEntries(ROWS.flatMap((row,r)=>row.map((c,i)=>['Key'+CODES[r][i],c]))), WORDS=['아이','나이','나라','아니','어머니'], LIMITS=[20,20,20,20,30];
let mode='home',queue=[],index=0,records=[],wordRecords=[],reviewLetters=[],deadline=0,timer=null,locked=false,first=null,errors=0,practiceCount=0,practiceTarget=0,seconds=10,composing=false,session=0;
// 모든 소리는 브라우저에서 작게 합성합니다. 외부 음원이나 자동 재생 요청은 없습니다.
let soundVolume=0.75;
function setSoundVolume(value){soundVolume=Math.max(.2,Math.min(1,Number(value)/100));initAudio();if(audioMaster){audioMaster.gain.cancelScheduledValues(audioContext.currentTime);audioMaster.gain.setValueAtTime(soundEnabled?soundVolume:0,audioContext.currentTime)}document.getElementById('volume-value').textContent=Math.round(soundVolume*100)+'%'}
let soundEnabled=true,audioContext=null,audioMaster=null,lastEffect=-Infinity,lastMistake=-Infinity;
function initAudio(){if(typeof window==='undefined')return;try{if(!audioContext){const AudioCtor=window.AudioContext||window.webkitAudioContext;if(!AudioCtor)return;audioContext=new AudioCtor();audioMaster=audioContext.createGain();audioMaster.gain.value=soundEnabled?soundVolume:0;audioMaster.connect(audioContext.destination)}if(soundEnabled&&audioContext.state==='suspended')audioContext.resume().catch(()=>{})}catch(_){}}
function toggleSound(){soundEnabled=!soundEnabled;initAudio();if(audioMaster){audioMaster.gain.cancelScheduledValues(audioContext.currentTime);audioMaster.gain.setValueAtTime(soundEnabled?soundVolume:0,audioContext.currentTime)}const button=document.getElementById('sound-toggle');button.textContent=soundEnabled?'🔊 소리 끄기':'🔇 소리 켜기';button.setAttribute('aria-pressed',String(soundEnabled));button.setAttribute('aria-label',soundEnabled?'효과음 켜짐, 누르면 소리 끄기':'효과음 꺼짐, 누르면 소리 켜기')}
function playSound(kind){if(!soundEnabled||document.hidden)return;initAudio();if(!audioContext||audioContext.state!=='running')return;const now=audioContext.currentTime;if(kind==='wrong'&&now-lastMistake<0.2)return;if(kind==='tick'&&now-lastEffect<0.25)return;if(kind==='wrong')lastMistake=now;if(kind!=='tick')lastEffect=now;const notes={correct:[[660,0,.12,.48],[880,.13,.18,.43]],wrong:[[330,0,.14,.38],[260,.15,.16,.34]],next:[[620,0,.10,.34]],timeout:[[390,0,.16,.40],[290,.18,.20,.35]],tick:[[1200,0,.065,.22]]}[kind]||[];try{for(const [frequency,delay,duration,volume] of notes){const oscillator=audioContext.createOscillator(),gain=audioContext.createGain(),at=now+delay;oscillator.type=kind==='tick'?'triangle':'sine';oscillator.frequency.value=frequency;gain.gain.setValueAtTime(0,at);gain.gain.linearRampToValueAtTime(volume,at+.008);gain.gain.exponentialRampToValueAtTime(.0001,at+duration);oscillator.connect(gain);gain.connect(audioMaster);oscillator.start(at);oscillator.stop(at+duration+.01);oscillator.onended=()=>{oscillator.disconnect();gain.disconnect()}}}catch(_){}}
document.addEventListener('pointerdown',initAudio,true);document.addEventListener('keydown',initAudio,true);
let basicStartedAt=null,basicElapsedMs=0;
function formatDuration(ms){const total=Math.max(0,Math.ceil(ms/1000)),minutes=Math.floor(total/60),remainder=total%60;return minutes?`${minutes}분 ${remainder}초`:`${remainder}초`}
const app=document.getElementById('app');const btn=(s,f,c='')=>`<button class="${c}" onclick="${f}">${s}</button>`;
let mistakePopup=null,mistakePopupTimer=null;
function clearMistake(){clearTimeout(mistakePopupTimer);mistakePopupTimer=null;if(mistakePopup){mistakePopup.remove();mistakePopup=null}}
function showMistake(word=false){clearMistake();const popup=document.createElement('div');popup.className='mistake-popup';popup.setAttribute('role','status');popup.setAttribute('aria-live','polite');popup.innerHTML=`<div class="mistake-popup-card"><h2>${word?'조금 달라요!':'다른 키를 눌렀어요!'}</h2><p>괜찮아요. 다시 도전해요!</p><div class="popup-guidance">${word?`<p><strong>${queue[index]}</strong>를 다시 써 봐요.</p>`:`<p>색이 켜진 줄을 찾아요!</p>${keyboardDiagram()}`}</div><small>바로 다시 입력해도 돼요 · 잠시 뒤 사라져요</small></div>`;document.body.append(popup);mistakePopup=popup;mistakePopupTimer=setTimeout(clearMistake,1500)}
function stop(){clearTimeout(expressAdvanceTimer);clearTimeout(helpTimer);clearMistake();clearInterval(timer);timer=null;session++;composing=false}function goHome(){stop();mode='home';home()}
function home(){app.innerHTML=`<section class="hero"><div><div class="eyebrow">SPACE RESCUE · 1일 우주 탐험</div><h1>잠든 별빛을<br>함께 깨워 볼까?</h1><p>손가락을 제자리에 올리고 출발!<br>연습하고, 점검하고, 나만의 별을 찾아요.</p></div><div class="art" aria-hidden="true"><div class="planet"></div><div class="orb"></div><span class="star">✦</span></div></section><section class="cards"><div class="card"><span class="num">01 · 천천히 준비해요</span><h2>별빛 연습장</h2><p>시간제한 없이<br>윗자리·기본자리·아랫자리를 익혀요.</p>${btn('연습 시작 →',"start('practice')",'primary')}</div><div class="card"><span class="num">02 · 나를 알아봐요</span><h2>별빛 점검</h2><p>세 줄을 섞은 20개의 별!<br>한 글자마다 ${seconds}초!</p>${btn('20문항 점검 →',"start('test')",'gold')}</div><div class="card"><span class="num">03 · 더 도전해요</span><h2>단어 행성</h2><p>준비된 친구는 도전!<br>5개 단어를 완성해요.</p>${btn('단어에 도전 →',"start('words')")}</div></section><div class="actions">${btn('자유 탐험 ∞',"start('free')")}${records.length?btn('내 점검 결과','results()'):''}${btn('새로 시작','resetAsk()','small')}</div>${expressEntry()}<details><summary>선생님 안내 · 수업 설정</summary><div class="panel"><p class="hint">추천 40분: 안내 5분 → 연습 10분 → 점검·결과 8분 → 복습 7분 → 단어·자유 탐험 10분. 기록은 이 창에서만 유지되며 새로고침·새로 시작 시 사라집니다.</p><label>점검 한 문항 <select onchange="seconds=Number(this.value);home()"><option value="10" ${seconds===10?'selected':''}>10초 (기본)</option><option value="15" ${seconds===15?'selected':''}>15초</option><option value="20" ${seconds===20?'selected':''}>20초</option></select></label><p class="hint">글자 점검: 실제 키보드 세 줄의 키 위치를 직접 읽어 한/영 상태와 관계없이 처리합니다. 단어: 한글 두벌식 상태로 입력 후 ‘완성했어요’를 누릅니다. 붙여넣기는 사용할 수 없습니다. 점검 점수는 첫 입력만 반영하며, 수정 성공은 별도로 표시합니다.</p></div></details><div class="footer">로그인 없이 · 인터넷 없이 · 오늘 한 번의 탐험</div>`}
function start(m){stop();mode=m;locked=false;index=0;practiceCount=0;practiceTarget=0;if(m==='test'){basicStartedAt=performance.now();basicElapsedMs=0;records=[];reviewLetters=[];queue=makeTestQueue()}else if(m==='words'){wordRecords=[];queue=[...WORDS]}else if(m==='review'){queue=reviewLetters.length?[...reviewLetters]:[...BASE]}else queue=[...BASE];renderQuestion()}
function shuffle(items){const a=[...items];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

function renderExpress(){stop();express.position=0;express.awaiting=false;express.feedback='';express.readyAt=performance.now();const item=express.items[express.cursor],pair=item.length===2,review=express.review;const limit=pair?EXPRESS_RULES.pairSeconds:EXPRESS_RULES.singleSeconds;app.innerHTML=`<section class="game express-game"><div class="eyebrow">${review?'시간제한 없는 특급 복습':pair?'미션 2 · 두 글자 이어 치기':'미션 1 · 한 글자 빠르게 찾기'} · ${express.cursor+1} / ${express.items.length}</div><h1>${review?'별빛 다시 깨우기':'별빛 특급 구조대!'}</h1><div class="panel"><p>${pair?'왼쪽부터 차례대로 눌러요!':'이 글자를 찾아요!'}</p><div class="express-target" id="express-target">${expressTarget()}</div><div class="express-steps" id="express-steps" aria-live="polite">${pair?'○ 첫 글자　→　○ 두 번째 글자':'한 번에 찾아봐요!'}</div>${review?(pair?'':keyboardDiagram(item[0])):'<div id="express-time" class="express-time"></div><div class="progress" role="progressbar" aria-label="남은 시간" aria-valuemin="0" aria-valuemax="'+limit+'" id="express-progress"><div id="express-bar"></div></div>'}<div id="express-status" class="status" role="status" aria-live="polite">${review?'천천히 다시 눌러 보세요.':'손가락 준비! 한 번씩 눌러요.'}</div></div><p class="hint">${review?'틀리면 처음 글자부터 다시 눌러요.':'키 위치 힌트 없이 도전해요. · 끝나면 자동으로 넘어가요.'}</p><div class="actions express-actions">${review?btn('특급 결과로','expressResults()','small'):''}${btn('우주 지도','goHome()','small')}</div></section>`;
if(!review){express.deadline=performance.now()+limit*1000;const token=session;let previous=limit;const tick=()=>{if(session!==token||!expressActive()||express.awaiting)return;const left=Math.max(0,express.deadline-performance.now()),remaining=Math.ceil(left/1000);if(remaining>0&&remaining<previous)playSound('tick');previous=remaining;document.getElementById('express-time').textContent=`남은 시간 ${remaining}초`;const bar=document.getElementById('express-bar');bar.style.width=`${left/(limit*10)}%`;bar.style.background=left<=3000?'#ffe39a':'';document.getElementById('express-progress').setAttribute('aria-valuenow',String(remaining));if(left<=0)finishExpress('timeout')};tick();timer=setInterval(tick,80)}}
function expressInput(letter){if(!expressActive()||express.awaiting)return;if(!express.review&&performance.now()>=express.deadline){finishExpress('timeout');return}const item=express.items[express.cursor];if(letter!==item[express.position]){const reason=item.length===2?(express.position===0&&letter===item[1]?'order':express.position===0?'first':'second'):'first';if(express.review){express.position=0;document.getElementById('express-target').innerHTML=expressTarget();document.getElementById('express-steps').textContent=item.length===2?'○ 첫 글자　→　○ 두 번째 글자':'다시 찾아봐요!';document.getElementById('express-status').textContent='괜찮아요! 처음 글자부터 다시 눌러요.';playSound('wrong')}else finishExpress(reason,letter);return}express.position++;document.getElementById('express-target').innerHTML=expressTarget();document.getElementById('express-steps').textContent=item.length===2?(express.position===1?'✓ 첫 글자　→　○ 두 번째 글자':'✓ 첫 글자　→　✓ 두 번째 글자'):'✓ 찾았어요!';if(express.position===item.length)finishExpress('correct');else{playSound('next');document.getElementById('express-status').textContent='첫 글자 성공! 다음 글자를 눌러요.'}}
function finishExpress(reason,pressed=null){if(!expressActive()||express.awaiting)return;express.awaiting=true;express.feedback=reason;clearInterval(timer);timer=null;const item=express.items[express.cursor],success=reason==='correct';if(!express.review){const row={target:[...item],success,first:success,reason,timeout:reason==='timeout',position:express.position,pressed};(mode==='expressSingle'?express.singleRecords:express.pairRecords).push(row)}const messages={correct:'반짝! 성공했어요! 다음 별로 가요.',first:'다른 키였어요. 다음 별에서 다시 도전!',second:'두 번째 키가 달랐어요. 다음 별로 가요!',order:'왼쪽 글자부터 눌러요! 다음 별로 가요.',timeout:'시간이 되었어요. 다음 별에서 다시 도전!'};document.getElementById('express-status').textContent=messages[reason];document.getElementById('express-status').className='status '+(success?'express-success':'express-retry');playSound(success?'correct':reason==='timeout'?'timeout':'wrong');const token=session;expressAdvanceTimer=setTimeout(()=>{if(token===session&&expressActive())advanceExpress()},EXPRESS_RULES.feedbackMs)}
function advanceExpress(){if(!express.awaiting)return;express.cursor++;if(express.cursor<express.items.length){renderExpress();return}if(express.review){expressReviewDone();return}if(mode==='expressSingle'){expressPairIntro();return}express.done=true;expressResults()}
// 8/10 이상을 해당 영역의 안정적인 입력 기준으로 사용합니다. 전반적인 타자 실력 판정은 아닙니다.
function expressRecommendation(single,pair){if(single<EXPRESS_RULES.strongScore)return {kind:'single',title:'글자 위치를 다시 찾아봐요!',message:'헷갈린 글자를 천천히 찾아보면 더 자신 있어져요.',action:'틀린 글자 연습'};if(pair<EXPRESS_RULES.strongScore)return {kind:'pair',title:'두 글자를 차례대로 눌러봐요!',message:'한 글자 찾기는 잘하고 있어요! 이제 두 글자를 순서대로 연습해요.',action:'두 글자 이어 치기 연습'};return {kind:'words',title:'두 미션 모두 잘했어요!',message:'정말 잘했어요! 이제 단어 행성에 도전해 봐요!',action:'단어 행성으로'}}
function expressResults(){stop();mode='expressResult';const single=express.singleRecords.filter(r=>r.success).length,pair=express.pairRecords.filter(r=>r.success).length,recommend=expressRecommendation(single,pair),rows=[...express.singleRecords,...express.pairRecords],wrong=rows.filter(r=>!r.success);const reasonLabels={correct:'성공',first:'첫 키 오답',second:'두 번째 키 오답',order:'순서 오류',timeout:'시간초과'};app.innerHTML=`<section class="game"><div class="eyebrow">EXPRESS STAR REPORT · 기본 점검과 별도 기록</div><h1>🚀 별빛 특급 구조대 완료!</h1><div class="score-card grade-${single>=8&&pair>=8?3:1}"><div class="big-score">${single+pair}<span>/ 20점</span></div><div class="stats"><div class="stat"><strong>${single} / 10</strong>⭐ 한 글자 찾기</div><div class="stat"><strong>${pair} / 10</strong>⭐ 두 글자 이어 치기</div></div><h2>${recommend.title}</h2><p>${recommend.message}</p></div><div class="panel"><h2>다음에는 이렇게 해요</h2>${recommend.kind==='words'?btn(recommend.action,"start('words')",'gold'):btn(recommend.action,`startExpressReview('${recommend.kind}')`,'primary')}<p class="hint">${wrong.length?'어려웠던 글자와 조합을 시간 걱정 없이 연습해요.':'모든 별을 한 번에 깨웠어요!'}</p>${wrong.length?btn('특급 오답 모두 복습',"startExpressReview('all')",'small'):''}</div><details><summary>선생님과 자세히 보기</summary><p class="hint">각 영역 8/10 이상이면 다음 도전을 추천합니다. 두 영역 점수는 키 위치 기억과 순서 입력을 따로 살펴보는 자료입니다.<br>오답이 한 번 발생하면 그 문제는 종료합니다. 복습은 원래 점수에 반영하지 않습니다.</p><table><thead><tr><th>미션</th><th>문제</th><th>결과</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${r.target.length===1?'한 글자':'두 글자'}</td><td>${r.target.join(' → ')}</td><td>${reasonLabels[r.reason]}</td></tr>`).join('')}</tbody></table><p class="hint">첫 키 오답 ${rows.filter(r=>r.reason==='first').length} · 두 번째 키 오답 ${rows.filter(r=>r.reason==='second').length} · 순서 오류 ${rows.filter(r=>r.reason==='order').length} · 시간초과 ${rows.filter(r=>r.timeout).length}</p></details><div class="actions express-actions">${btn('특급 다시 도전','expressIntro()','gold')}${records.length?btn('기본 점검 결과','results()'):''}${btn('자유 탐험',"start('free')")}${btn('단어 행성',"start('words')")}${btn('우주 지도','goHome()','small')}</div></section>`;if(express.done)celebrate(single>=8&&pair>=8?3:1)}
function startExpressReview(kind){stop();const singles=express.singleRecords.filter(r=>!r.success).map(r=>[...r.target]),pairs=express.pairRecords.filter(r=>!r.success).map(r=>[...r.target]);let items=kind==='single'?singles:kind==='pair'?pairs:[...singles,...pairs];if(!items.length){expressResults();return}express.items=items;express.cursor=0;express.review=true;mode='expressReview';renderExpress()}
function expressReviewDone(){stop();mode='expressReviewDone';app.innerHTML=`<section class="game"><h1>복습 별빛이 반짝!</h1><div class="panel"><h2>끝까지 연습했어요!</h2><p>처음 특급 점수는 그대로예요.<br>이제 다음 탐험을 골라요.</p></div><div class="actions express-actions">${btn('특급 결과 보기','expressResults()','primary')}${btn('자유 탐험',"start('free')")}${btn('단어 행성',"start('words')",'gold')}</div></section>`}
// Capture 물리 키를 직접 판정합니다. 한글 IME의 key/229/조합 문자열에 의존하지 않습니다.
document.addEventListener('keydown',e=>{const held=expressHeldKeys.has(e.code);expressHeldKeys.add(e.code);if(!expressActive())return;if(e.ctrlKey||e.metaKey||e.altKey||e.target.matches('input,select,textarea'))return;if(/^Key[A-Z]$/.test(e.code)){e.preventDefault();e.stopImmediatePropagation();if(e.repeat||held||express.awaiting)return;if(Number.isFinite(e.timeStamp)&&e.timeStamp>0&&e.timeStamp<express.readyAt)return;expressInput(MAP[e.code]||'?')}else if(e.key==='Enter'){e.preventDefault();e.stopImmediatePropagation()}},true);
document.addEventListener('keyup',e=>expressHeldKeys.delete(e.code),true);
if(typeof window!=='undefined')window.addEventListener('blur',()=>expressHeldKeys.clear());

function resetAsk(){if(confirm('오늘의 점검 기록을 지우고 처음부터 시작할까요?')){stop();basicStartedAt=null;basicElapsedMs=0;records=[];wordRecords=[];reviewLetters=[];express.singleRecords=[];express.pairRecords=[];express.items=[];express.done=false;express.review=false;express.awaiting=false;expressHeldKeys.clear();seconds=10;mode='home';home()}}
home();
</script></html>
